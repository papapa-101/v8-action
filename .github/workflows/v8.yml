name: BUILD and Complie v8

on:
  push:
    branches: [ master ]

env:
  PATCH_FLAG: false #给v8打上patch，不需要则false
  COMMIT: 4a03d61accede9dd0e3e6dc0456ff5a0e3f792b4  #v8对应的版本号
  SRC_UPLOAD: true
  BINARY_UPLOAD: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id  
    
    steps:
    - name: Checkout
      uses: actions/checkout@master
      
    # init ubuntu20.04 environment
    - name: init env 
      run: |
        sudo apt-get update
        sudo apt-get -y install pkg-config git subversion curl wget build-essential xz-utils zip p7zip-full python3
        # curl -fsSL git.io/file-transfer | sh
        curl -sL https://git.io/file-transfer | sh 
        ls -l
        
    # get depot_tools
    - name: depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo export PATH=\"\$PATH:`pwd`/depot_tools/\" >> ~/.bash_profile
    
    # fetch v8 source code
    - name: fetch v8
      run: |
        source ~/.bash_profile
        fetch v8
        cd v8
        # git reset --hard $COMMIT
        cd ..

    - name: save src
      if: env.SRC_UPLOAD == 'true' && !cancelled()
      run: |
        zip -q -r v8.zip v8
        ls -lh v8.zip
        ./transfer wss v8.zip
    

